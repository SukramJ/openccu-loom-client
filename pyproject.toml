[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openccu-loom-client"
dynamic = ["version"]
description = "Async Python REST + WebSocket client for the openccu-loom daemon"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "OpenCCU-Loom authors" }]
requires-python = ">=3.14"
dependencies = [
    # A floor, not a pin and not a cap. This package is a library and
    # `homematicip_local` is the application that consumes it — and that
    # application depends on aiohomematic directly and pins it exactly. An `==`
    # here would therefore not merely force an extra release per aiohomematic
    # release; the moment the consumer pinned a different version the two
    # requirements would be unsatisfiable together and this library would block
    # the only thing that installs it.
    #
    # The floor names what is actually required: `InboxDeviceData.awaiting_release`
    # arrived in 2026.8.6. No upper bound, because there is no honest one to
    # write — CalVer carries no compatibility semantics, so `<2026.9` would
    # claim 2026.9.0 breaks something merely because a month turned.
    #
    # What guards the coupling is not metadata but the drift-guard test
    # (tests/compat/test_aiohomematic_protocol_parity.py) running against the
    # exact version in requirements.txt. That is the CI pin, and it is where a
    # new aiohomematic series gets validated before anyone relies on it.
    #
    # (openccu-loom-types is pinned exactly and that is not a contradiction:
    # nothing but this client consumes it, so an exact pin there cannot
    # conflict with anybody.)
    "aiohomematic>=2026.8.6",
    # Floors match the CI-pinned versions in requirements.txt so a fresh
    # `pip install` resolves a tested-compatible set, not an ancient one.
    "aiohttp>=3.12.0",
    "openccu-loom-types==0.5.9",
    "pydantic>=2.12.0",
    "python-slugify>=8.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SukramJ/openccu-loom-client"
"Bug Tracker" = "https://github.com/SukramJ/openccu-loom-client/issues"
"Daemon Repo" = "https://github.com/SukramJ/openccu-loom"

[project.optional-dependencies]
# Convenience extra for `pip install -e '.[dev]'`. aiohomematic is already a
# runtime dependency (inherited here); CI pins the exact toolchain versions in
# requirements_test.txt. The daemon HTTP surface is mocked by tests/helpers
# MockDaemon (a real in-process aiohttp server), so no aioresponses.
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "pylint>=3.2",
]

[tool.setuptools.dynamic]
version = { attr = "openccu_loom_client.const.VERSION" }

[tool.setuptools.packages.find]
include = ["openccu_loom_client*"]

[tool.setuptools.package-data]
openccu_loom_client = ["py.typed"]

[tool.pylint.MAIN]
py-version = "3.14"
ignore = [
    "tests",
]

# Use a conservative default here; 2 should speed up most setups and not hurt
# any too bad. Override on command line as appropriate.
jobs = 2
load-plugins = [
    "pylint.extensions.code_style",
    "pylint.extensions.typing",
]
persistent = false
fail-on = ["I"]

[tool.pylint.BASIC]
class-const-naming-style = "any"
good-names = [
    "_",
    "ev",
    "ex",
    "fp",
    "i",
    "id",
    "j",
    "k",
    "Run",
    "ip",
    "T",
]

[tool.pylint."MESSAGES CONTROL"]
# Reasons disabled:
# format - handled by ruff/formatter
# locally-disabled - it spams too much
# duplicate-code - unavoidable
# cyclic-import - doesn't test if both import on load
# abstract-class-little-used - prevents from setting right foundation
# unused-argument - generic callbacks and setup methods create a lot of warnings
# too-many-* - are not enforced for the sake of readability
# too-few-* - same as too-many-*
# abstract-method - with intro of async there are always methods missing
# inconsistent-return-statements - doesn't handle raise
# too-many-ancestors - it's too strict.
# wrong-import-order - isort guards this
# consider-using-f-string - str.format sometimes more readable
# ---
# Pylint CodeStyle plugin
# consider-using-namedtuple-or-dataclass - too opinionated
# consider-using-assignment-expr - decision to use := better left to devs
disable = [
    "format", # Formatting concerns (use Black/ruff instead)
    "abstract-method", # Allow abstract base classes without all abstract methods implemented
    "broad-except", # Allow bare `except:` or overly broad exceptions in some cases
    "cyclic-import", # Ignore import cycles between modules
    "duplicate-code", # Allow similar/duplicated code blocks without warning
    "inconsistent-return-statements", # Allow functions with branches that don't all return explicitly
    "import-outside-toplevel",  # C0415: Allow imports inside functions to avoid heavy top-level imports
    "locally-disabled", # Allow local `pylint: disable` pragmas without warnings
    "not-context-manager", # Allow using objects in with-statements without context manager methods
    "too-few-public-methods", # Allow small data classes/helpers without many public methods
    "too-many-ancestors", # Allow deep inheritance hierarchies
    "too-many-arguments", # Permit functions with many parameters when pragmatic
    "too-many-instance-attributes", # Allow classes with many instance attributes
    "too-many-lines", # Allow large modules when splitting would hurt readability
    "too-many-locals", # Allow functions with many local variables
    "too-many-positional-arguments", # R0917: Permit many positional params when API stability/readability wins
    "too-many-public-methods", # Allow classes exposing many public methods when warranted
    "too-many-boolean-expressions", # Permit complex boolean conditions when clearer than refactoring
    "wrong-import-order", # Enforced by Ruff/isort; allow non-standard ordering here
    #"consider-using-f-string",
    "consider-using-namedtuple-or-dataclass", # Too opinionated; dataclasses/namedtuples by dev choice
    "consider-using-assignment-expr", # R6103: decision to use := is better left to devs
    "unnecessary-ellipsis", # W2301: `...` is idiomatic in Protocol/stub method bodies
    "protected-access", # W0212: store mutates domain wrappers via their private `_replace_*`/
                        # `_upsert_*`/`_attach_*` methods by design (see CLAUDE.md); ruff `SLF001`
                        # already guards this precisely per-file.
    "attribute-defined-outside-init", # W0201: registration mixins set `_registered`/`_enabled_default`
                                      # lazily and read them via `getattr(self, ..., False)`; they do
                                      # not own the host class's __init__.

