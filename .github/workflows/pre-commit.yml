name: Pre-commit checks

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  # Branch work is checked via its PR; push only re-runs on main (post-merge)
  # so feature branches don't trigger a second, duplicate run.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    if: github.repository_owner == 'SukramJ'
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements_test.txt
            requirements_test_pre_commit.txt

      - name: Install dependencies for hooks
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run prek
        # `no-commit-to-branch` guards a developer's working copy against a
        # direct commit to main. On the post-merge run it can only ever fail,
        # because the checkout *is* main — and it did, on every merge, which
        # made this workflow permanently red and therefore unread. Skipping it
        # here removes a check that had no meaning in CI, not one that did.
        env:
          SKIP: ${{ github.event_name == 'push' && 'no-commit-to-branch' || '' }}
        run: prek run --all-files
