name: "E2E (real daemon)"

# End-to-end tests that drive the real openccu-loom daemon (and, for
# the device-backed tier, the godevccu simulator) as subprocesses.
# Heavy and cross-repo, so this runs on manual dispatch rather than on
# every PR. The unit suite (Test-Run) stays the per-PR gate.
#
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client
        uses: actions/checkout@v7
        with:
          path: openccu-loom-client

      # The daemon and godevccu are checked out as siblings so the
      # daemon's `replace github.com/SukramJ/godevccu => ../godevccu`
      # resolves. A PAT (secret LOOM_REPOS_TOKEN) is used when the repos
      # are private; for public repos the default token suffices.
      - name: Checkout daemon
        uses: actions/checkout@v7
        with:
          repository: SukramJ/openccu-loom
          path: openccu-loom
          token: ${{ secrets.LOOM_REPOS_TOKEN || github.token }}

      - name: Checkout godevccu
        uses: actions/checkout@v7
        with:
          repository: SukramJ/godevccu
          path: godevccu
          token: ${{ secrets.LOOM_REPOS_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: openccu-loom/go.mod

      - name: Build daemon + godevccu-e2e helper
        working-directory: openccu-loom
        run: |
          go build -o bin/openccu-loom ./cmd/openccu-loom
          go build -o bin/godevccu-e2e ./cmd/godevccu-e2e

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: Install client + dev deps
        working-directory: openccu-loom-client
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run e2e (Tier A + Tier B)
        working-directory: openccu-loom-client
        env:
          LOOM_DAEMON_BIN: ${{ github.workspace }}/openccu-loom/bin/openccu-loom
          GODEVCCU_E2E_BIN: ${{ github.workspace }}/openccu-loom/bin/godevccu-e2e
        run: pytest -m "e2e or e2e_ccu" -v
