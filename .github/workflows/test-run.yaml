name: "Test-Run"

# yamllint disable-line rule:truthy
on:
  pull_request: ~
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14t (free-threaded) is exercised to keep the pure-Python client
        # free-threading compatible.
        python-version: ["3.14", "3.14t"]
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      # The daemon's `assets/wsapi.json` is the source the broadcast drift
      # guard compares against. Without it that test skips, which is how a
      # new daemon broadcast could land unbound without anything going red.
      #
      # Pinned to the daemon's latest *release*, not its default branch. This
      # package only ever regenerates from releases — `wire-regen-clean.yml`
      # and `regenerate-on-daemon-release.yml` both check the daemon out at a
      # tag — so measuring against `main` compares against a contract this
      # package will never adopt directly, and lets an unrelated daemon merge
      # turn a pull request red here for a reason its author cannot act on.
      # A guard that goes red for unactionable reasons is a guard that gets
      # ignored. Drift still surfaces, one daemon release later, on the
      # regeneration PR that would adopt it.
      - name: Resolve the daemon's latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --repo SukramJ/openccu-loom --json tagName --jq .tagName)"
          echo "Pinning the daemon contract to ${TAG}"
          echo "DAEMON_TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Check out the daemon for its wire contract
        uses: actions/checkout@v7
        with:
          repository: SukramJ/openccu-loom
          ref: ${{ env.DAEMON_TAG }}
          path: openccu-loom
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements_test.txt
            requirements_test_pre_commit.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests with coverage
        env:
          OPENCCU_LOOM_REPO: ${{ github.workspace }}/openccu-loom
        run: |
          pytest tests/ --cov=openccu_loom_client --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
